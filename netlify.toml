# netlify.toml — Netlify deployment configuration for StudyMate

[build]
  # The folder that contains index.html (repo root = ".")
  publish = "."

  # No build command needed — this is a static HTML/CSS/JS project
  command = ""

# ── Security & Asset Headers ──────────────────────────────────────────────────
[[headers]]
  for = "/*"
  [headers.values]
    # Allow fonts from Google Fonts to load correctly
    Content-Security-Policy = "default-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; script-src 'self'; img-src 'self' data:; connect-src 'self'"
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# ── Cache CSS / JS with long TTL ─────────────────────────────────────────────
[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# ── SPA-style redirect: all routes serve index.html ──────────────────────────
# (Not strictly needed for a single-page app, but prevents 404 on deep links)
[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200
